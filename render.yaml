services:
  - type: web
    name: ngan-hang-cau-hoi-chinh-tri
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: question-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:/var/data/questions.db
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_TEACHER_PASSWORD
        generateValue: true
      - key: SEED_STUDENT_PASSWORD
        generateValue: true
      - key: AI_MODE
        value: demo
